<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Crossroads Art Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200;0,9..144,300;0,9..144,400;1,9..144,200;1,9..144,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#15110E;--paper:#ffffff;--gold:#D9A441;--hair:rgba(21,17,14,.16)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#fff;color:var(--ink);font-family:'Inter',system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:baseline;gap:1.1rem;padding:.7rem 1.2rem .3rem;flex:0 0 auto}
header .t{font-family:'Fraunces',serif;font-weight:200;font-size:1.18rem;letter-spacing:.01em}
header .t em{font-style:italic;color:var(--gold)}
header .k{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(246,240,228,.45)}
header .spacer{flex:1}
header a{color:rgba(21,17,14,.45);text-decoration:none;font-size:1.5rem;line-height:1;padding:.2rem .4rem}
header a:hover{color:var(--ink)}
#stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;padding:0 2.2rem}
#flip{filter:drop-shadow(0 18px 46px rgba(0,0,0,.22))}
.stf__parent{margin:0 auto;background:transparent}
.stf__wrapper{background:transparent}
/* every leaf, including the implicit blanks, is dark board not white paper */
.stf__item{background:#fff}
.pg{width:100%;height:100%;background:#fff;overflow:hidden}
.pg img{width:100%;height:100%;object-fit:cover;display:block}
footer{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:2.4rem;padding:.4rem 1.6rem .9rem}
button{background:none;border:0;color:var(--ink);width:4.4rem;height:4.4rem;cursor:pointer;
  font-size:3.4rem;line-height:1;transition:opacity .2s;display:grid;place-items:center;opacity:.65}
button:hover:not(:disabled){opacity:1}
button:disabled{opacity:.14;cursor:default}
#counter{width:9rem;height:2px;background:rgba(21,17,14,.12);position:relative}
#counter::after{content:'';position:absolute;left:0;top:0;height:2px;width:var(--p,0%);background:var(--ink);transition:width .4s}
#hint{position:absolute;bottom:.4rem;left:0;right:0;text-align:center;font-size:.6rem;
  letter-spacing:.2em;text-transform:uppercase;color:rgba(246,240,228,.26);transition:opacity .6s}
#loader{position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:20;transition:opacity .7s}
#loader .inner{text-align:center}
#loader .bar{width:11rem;height:2px;background:rgba(21,17,14,.14);margin:1.1rem auto 0;overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
#loader .lbl{font-family:'Fraunces',serif;font-weight:200;font-size:1.5rem}
#loader .lbl em{font-style:italic;color:var(--gold)}
#loader .sub{font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:rgba(246,240,228,.4);margin-top:.7rem}
@media(max-width:760px){#stage{padding:0 .7rem}header{padding:.9rem 1rem .6rem}header .k{display:none}}
</style></head><body>

<div id="loader"><div class="inner">
  <div class="bar"><i id="bar"></i></div>
</div></div>

<header>
  <div class="spacer"></div>
  <a href="../" aria-label="Back to site">&#10005;</a>
</header>

<div id="stage">
  <div id="flip"></div>
  <div id="src" hidden></div>
</div>

<footer>
  <button id="prev" aria-label="Previous page">&#8592;</button>
  <div id="counter"></div>
  <button id="next" aria-label="Next page">&#8594;</button>
</footer>

<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
const N = 57;
const urls = Array.from({length:N},(_,i)=>`pages/p${String(i).padStart(2,'0')}.jpg`);
const bar = document.getElementById('bar');
let loaded = 0;
const src = document.getElementById('src');
src.innerHTML = urls.map(u=>`<div class="pg"><img src="${u}" alt=""></div>`).join('');
Promise.all(urls.map(u=>new Promise(res=>{
  const im = new Image();
  im.onload = im.onerror = ()=>{ loaded++; bar.style.width = (loaded/N*100)+'%'; res(); };
  im.src = u;
}))).then(start);

function fit(){
  const stage = document.getElementById('stage');
  const availH = stage.clientHeight - 24;
  const availW = stage.clientWidth - 24;
  // two square pages side by side => 2:1
  let h = Math.min(availH, availW/2) * 0.99;
  return Math.max(240, Math.floor(h));
}

let pf;
function start(){
  const side = fit();
  pf = new St.PageFlip(document.getElementById('flip'), {
    width: side, height: side,
    size: 'fixed',
    showCover: true,
    maxShadowOpacity: 0.22,
    flippingTime: 780,
    usePortrait: window.innerWidth < 760,
    mobileScrollSupport: false,
    drawShadow: true
  });
  pf.loadFromHTML(document.querySelectorAll('#src .pg'));
  pf.on('flip', update);
  window.pf = pf;
  update();
  document.getElementById('loader').style.opacity = 0;
  setTimeout(()=>document.getElementById('loader').remove(), 750);
  setTimeout(()=>{ const h=document.getElementById('hint'); if(h) h.style.opacity=0; }, 6500);
}

function update(){
  const i = pf.getCurrentPageIndex();
  const total = pf.getPageCount();
  const c = document.getElementById('counter');
  c.style.setProperty('--p', ((i)/(total-1)*100)+'%');
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').disabled = i >= total-1;
}

document.getElementById('prev').onclick = ()=>pf.flipPrev();
document.getElementById('next').onclick = ()=>pf.flipNext();
document.addEventListener('keydown', e=>{
  if(!pf) return;
  if(e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); pf.flipNext(); }
  if(e.key==='ArrowLeft') { e.preventDefault(); pf.flipPrev(); }
  if(e.key==='Home') pf.flip(0);
  if(e.key==='End') pf.flip(pf.getPageCount()-1);
});
let rt;
window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>{
  if(!pf) return; const i=pf.getCurrentPageIndex();
  const keep = document.getElementById('src').innerHTML;
  document.getElementById('flip').innerHTML='';
  document.getElementById('src').innerHTML = keep;
  const side=fit();
  pf = new St.PageFlip(document.getElementById('flip'), {width:side,height:side,size:'fixed',showCover:true,
    maxShadowOpacity:.5,flippingTime:780,usePortrait:window.innerWidth<760,mobileScrollSupport:false,drawShadow:true});
  pf.loadFromHTML(document.querySelectorAll('#src .pg')); pf.on('flip',update); pf.flip(i); update();
},260); });
</script>
</body></html>
